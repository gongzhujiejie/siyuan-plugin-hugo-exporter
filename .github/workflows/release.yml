name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build plugin
        run: pnpm build

      - name: Package plugin
        run: node scripts/package-plugin.mjs

      - name: Create package.zip
        # NOTE: 思源市场约定 zip 内必须直接含 index.js / plugin.json，不要多一层目录。
        run: |
          cd .release/siyuan-plugin-hugo-exporter
          zip -r ../../package.zip .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: package.zip
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
